<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Vocabulary List</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json?v=12">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="theme-color" content="#2563eb">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
  <div class="app-shell">
    <div class="top-bar">
      <h1>My Vocabulary</h1>
      <div class="top-bar-buttons">
        <button type="button" id="voice-toggle" class="theme-toggle-btn" aria-label="Toggle voice">
          👩 Voice
        </button>
        <button type="button" id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle theme">
          🌙 Dark
        </button>
      </div>
    </div>
    <div class="tab-bar">
      <button type="button" class="tab-button active" data-tab="vocab-tab">
        Vocabulary
      </button>
      <button type="button" class="tab-button" data-tab="rules-tab">
        Rules
      </button>
    </div>
    <section id="vocab-tab" class="tab-page">
      
      <!-- Word of the day -->
      <div class="controls" id="word-of-day-panel">
        <div>
          <label>Word of the day</label>
          <ul id="word-of-day-list"></ul>
        </div>
      </div>

      <!-- Stats panel -->
      <div class="controls" id="stats-panel">
        <div>
          <label>Stats</label>
          <div class="stats-row">
            <span id="stats-total"></span>
            <span id="stats-hard"></span>
            <span id="stats-due"></span>
          </div>
        </div>
      </div>
      
      <!-- Add / edit word form -->
      <details id="vocab-form-wrap" class="collapsible">
        <summary>Add a word</summary>
        <div class="collapsible-content">
        <form id="vocab-form">
          <div>
            <label for="word">Word EN</label>
            <input id="word" required />
          </div>
          <div>
            <label for="fr">Word FR</label>
            <input id="fr" />
          </div>
          <div>
            <label for="type">Type</label>
            <select id="type">
              <option value="">(choose)</option>
              <option>Verb</option>
              <option>Noun</option>
              <option>Adjective</option>
              <option>Adverb</option>
              <option>Prep</option>
              <option>Expression</option>
              <option>Other</option>
            </select>
          </div>
          <div>
            <label for="meaning">Meaning / Definition</label>
            <input id="meaning" />
          </div>
          <div class="full-width">
            <label for="comment">Comment</label>
            <textarea id="comment"></textarea>
          </div>
          <div class="full-width">
            <button type="submit" id="submit-btn" class="primary-btn">Add word</button>
            <button type="button" id="cancel-edit" style="display:none;">Cancel edit</button>
            <span id="editing-indicator" class="editing-indicator" style="display:none;">
              Editing existing word…
            </span>
          </div>
        </form>
        </div>
      </details>
  
      <!-- Quiz settings (collapsible) -->
        <details id="quiz-controls-wrap" class="collapsible">
          <summary>Quiz settings</summary>
          <div class="collapsible-content">
            <div class="controls quiz-controls">
              <div>
                <label for="quiz-direction">Quiz direction</label>
                <select id="quiz-direction">
                  <option value="en-fr">EN → FR</option>
                  <option value="fr-en">FR → EN</option>
                  <option value="mixed">Mixed</option>
                </select>
              </div>
              <div>
                <label for="quiz-mode">Mode</label>
                <select id="quiz-mode">
                  <option value="typing">Typing</option>
                  <option value="multiple">MCQ</option>
                </select>
              </div>
              <div>
                <label for="quiz-count">Questions</label>
                <select id="quiz-count">
                  <option value="5">5</option>
                  <option value="10">10</option>
                  <option value="20">20</option>
                  <option value="all">All</option>
                </select>
              </div>
              <div>
                <label for="quiz-pool">Quiz pool</label>
                <select id="quiz-pool">
                  <option value="all">All</option>
                  <option value="hard">Hard</option>
                  <option value="due">Review</option>
                </select>
              </div>
              <div>
                <button type="button" id="start-quiz-btn" class="primary-btn">Start quiz</button>
              </div>
            </div>
          </div>
        </details>

        <!-- Search / filter / sort / words per page -->
        <details id="table-controls-wrap" class="collapsible">
          <summary>Search and filters</summary>
          <div class="collapsible-content">
            <div class="controls" id="table-controls">
              <div class="control-search">
                <label for="search">Search</label>
                <input id="search" placeholder="Search…" />
              </div>
              <div class="control-filter">
                <label for="filter-type">Filter by type</label>
                <select id="filter-type">
                  <option value="">All</option>
                  <option>Verb</option>
                  <option>Noun</option>
                  <option>Adj</option>
                  <option>Adverb</option>
                  <option>Prep</option>
                  <option>Exp</option>
                  <option>Other</option>
                </select>
              </div>
              <div class="control-sort">
                <label for="sort-by">Sort by</label>
                <select id="sort-by">
                  <option value="word">EN (A–Z)</option>
                  <option value="fr">FR (A–Z)</option>
                  <option value="type">Type</option>
                  <option value="newest">Date (new)</option>
                  <option value="oldest">Date (old)</option>
                </select>
              </div>
              <div class="control-page-size">
                <label for="page-size">Words per page</label>
                <select id="page-size">
                  <option value="10">10</option>
                  <option value="25" selected>25</option>
                  <option value="50">50</option>
                  <option value="100">100</option>
                  <option value="all">All</option>
                </select>
              </div>
            </div>
          </div>
        </details>

      <!-- Quiz area -->
      <div id="quiz-area" class="quiz-area" style="display:none;">
        <div id="quiz-header"></div>
        <div id="quiz-question"></div>
        <div id="quiz-input-area"></div>
        <div id="quiz-feedback"></div>
        <div class="quiz-buttons">
          <div class="quiz-buttons-main">
            <button type="button" id="quiz-check-btn">Check</button>
            <button type="button" id="quiz-next-btn" style="display:none;">Next</button>
            <button type="button" id="quiz-skip-btn">Skip</button>
          </div>
          <button type="button" id="quiz-end-btn">End quiz</button>
        </div>
      </div>

      <!-- Compact pagination bar: icons + info -->
      <div id="pagination-bar">
        <button type="button" id="prev-page" class="icon-btn" title="Previous page">‹</button>
        <button type="button" id="next-page" class="icon-btn" title="Next page">›</button>
        <span id="page-info"></span>
      </div>
      
      <!-- Table: vocabulary -->
      <table>
        <thead>
          <tr>
            <th class="small word-col">Word</th>
            <th class="small">FR</th>
            <th class="small">Type</th>
            <th class="small">Difficulty</th>
            <th class="col-meaning">Meaning</th>
            <th class="col-comment">Comment</th>
            <th class="small">Actions</th>
          </tr>
        </thead>
        <tbody id="vocab-body"></tbody>
      </table>

      <!-- Export / import everything (vocab + rules) -->
      <div class="controls">
        <div>
          <button type="button" id="export-all-vocab-btn">
            Export all (JSON)
          </button>
        </div>
        <div>
          <label for="import-all-vocab-input">Import all (JSON)</label>
          <input
            type="file"
            id="import-all-vocab-input"
            accept=".json,application/json"
          />
        </div>
      </div> 
    </section>  
    <section id="rules-tab" class="tab-page hidden">
      <h2>Grammar & usage rules</h2>

      <details id="rules-form-wrap" class="collapsible">
        <summary>Add a rule</summary>
        <div class="collapsible-content">
        <form id="rules-form">
          <div>
            <label for="rule-title">Title</label>
            <input id="rule-title" required />
          </div>
          <div>
            <label for="rule-category">Category</label>
            <select id="rule-category">
              <option value="">(choose one)</option>
              <option>Verb patterns</option>
              <option>Tenses</option>
              <option>Prepositions</option>
              <option>Collocations</option>
              <option>Other</option>
            </select>
          </div>
          <div class="full-width">
            <label for="rule-explanation">Explanation</label>
            <textarea id="rule-explanation" required></textarea>
          </div>
          <div class="full-width">
            <label for="rule-examples">Examples</label>
            <textarea
              id="rule-examples"
              placeholder="One example per line"
            ></textarea>
          </div>
          <div class="full-width">
            <button type="submit" id="rule-submit-btn" class="primary-btn">Add rule</button>
            <button type="button" id="rule-cancel-edit" style="display:none;">Cancel edit</button>
            <span id="rule-editing-indicator" class="editing-indicator" style="display:none;">
              Editing existing rule…
            </span>
          </div>
        </form>
        </div> 
      </details>
      <div class="controls" id="rules-controls">
        <div>
          <label for="rules-search">Search</label>
          <input id="rules-search" placeholder="Search title / explanation…" />
        </div>
        <div>
          <label for="rules-filter-category">Filter by category</label>
          <select id="rules-filter-category">
            <option value="">All</option>
            <option>Verb patterns</option>
            <option>Tenses</option>
            <option>Prepositions</option>
            <option>Collocations</option>
            <option>Other</option>
          </select>
        </div>
        <div>
          <label for="rules-sort-by">Sort by</label>
          <select id="rules-sort-by">
            <option value="newest">Newest first</option>
            <option value="title">Title (A–Z)</option>
            <option value="category">Category</option>
          </select>
        </div>
      </div>      
      <table>
        <thead>
          <tr>
            <th class="rules-col-title">Title</th>
            <th class="small">Category</th>
            <th class="rules-col-explanation">Explanation</th>
            <th class="rules-col-examples">Examples</th>
            <th class="small">Actions</th>
          </tr>
        </thead>
        <tbody id="rules-body"></tbody>
      </table>      
      <!-- Export / import everything (vocab + rules) -->
      <div class="controls">
        <div>
          <button type="button" id="export-all-rules-btn">
            Export all (JSON)
          </button>
        </div>
        <div>
          <label for="import-all-rules-input">Import all (JSON)</label>
          <input
            type="file"
            id="import-all-rules-input"
            accept=".json,application/json"
          />
        </div>
      </div>
    </section>  
  </div>
  <script src="helpers.js"></script>
  <script src="theme_voice.js"></script>
  <script src="rules.js"></script>
  <script src="ui.js"></script>
  <script src="word_of_day.js"></script>
  <script src="app.js"></script>
  <script src="quiz.js"></script>
  <script src="export_import.js"></script>
</body>
</html>
